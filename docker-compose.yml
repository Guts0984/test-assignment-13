# Auction — full stack. Blocks are added one by one; this file grows with them.
#   cp .env.example .env && docker compose up --build
name: auction

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30
    # Not published to the host by default; uncomment to inspect the database with psql.
    # ports: ['5432:5432']

  # Runs once and exits: migrations → restricted application role → seed. Safe to re-run.
  db-init:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SEED_ENABLED: ${SEED_ENABLED}
      SEED_USERS: ${SEED_USERS}
      SEED_LOTS: ${SEED_LOTS}
      SEED_BIDS: ${SEED_BIDS}
      SEED_RNG: ${SEED_RNG}
      SEED_PASSWORD: ${SEED_PASSWORD}
    restart: 'no'

volumes:
  postgres-data:
