# Auction — full stack. Blocks are added one by one; this file grows with them.
#   cp .env.example .env && docker compose up --build
name: auction

x-worker-env: &worker-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  MEILI_URL: ${MEILI_URL}
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
  S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  MAIL_FROM: ${MAIL_FROM}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
  PAYMENT_PROVIDER_API_KEY: ${PAYMENT_PROVIDER_API_KEY}
  PROVIDER_BASE_URL: ${PROVIDER_BASE_URL}
  LOG_LEVEL: ${LOG_LEVEL}
  ANTI_SNIPE_MS: ${ANTI_SNIPE_MS}
  PAYMENT_WINDOW_MS: ${PAYMENT_WINDOW_MS}
  OFFER_WINDOW_MS: ${OFFER_WINDOW_MS}
  REVIEW_CLAIM_MS: ${REVIEW_CLAIM_MS}
  AUTO_CONFIRM_MS: ${AUTO_CONFIRM_MS}
  OUTBID_EMAIL_THROTTLE_MS: ${OUTBID_EMAIL_THROTTLE_MS}
  FAVORITE_REMINDER_MS: ${FAVORITE_REMINDER_MS}
  SWEEPER_INTERVAL_MS: ${SWEEPER_INTERVAL_MS}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs once and exits: migrations → restricted application role → seed. Safe to re-run.
  db-init:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SEED_ENABLED: ${SEED_ENABLED}
      SEED_USERS: ${SEED_USERS}
      SEED_LOTS: ${SEED_LOTS}
      SEED_BIDS: ${SEED_BIDS}
      SEED_RNG: ${SEED_RNG}
      SEED_PASSWORD: ${SEED_PASSWORD}
    restart: 'no'

  # Redis holds queues and socket pub/sub only. It is deliberately NOT persistent: losing it must
  # lose nothing, because Postgres is the source of truth and the worker re-queues from it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.22
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:7700/health']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage. The official minio/minio image is no longer published on Docker
  # Hub, so this is a community build of the same server; override MINIO_IMAGE to use another.
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: ['minio', 'server', '/data', '--address', ':9000', '--console-address', ':9001']
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9000/minio/health/live || wget -qO- http://localhost:9000/minio/health/live',
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  # Mail stub: accepts SMTP on 1025 and shows every message on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/livez || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs once and exits: buckets, search index (+ first full build), placeholder photos.
  infra-init:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ['node', 'apps/worker/dist/cli.js', 'init']
    depends_on:
      db-init:
        condition: service_completed_successfully
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *worker-env
    restart: 'no'

  # Any number of copies may run (docker compose up --scale worker=3): every job is idempotent.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      infra-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment: *worker-env

  api-a: &api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      infra-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: &api-env
      <<: *worker-env
      NODE_ID: a
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL}
      PAYMENT_STUB_CHAOS: ${PAYMENT_STUB_CHAOS}
      TRUSTED_PROXY: ${TRUSTED_PROXY}
      TEST_CLOCK: ${TEST_CLOCK}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

  # A second copy of the same API, so cross-copy realtime and failover are real, not theoretical.
  api-b:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: b

  nginx:
    build: infra/nginx
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  meili-data:
  minio-data:
