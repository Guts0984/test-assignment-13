name: CI

on:
  push:
  pull_request:

# One run per commit, never cancelled by a later push (the assignment asks for CI on every commit).
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: format · lint · typecheck · tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Start Postgres, Redis, Meilisearch, MinIO and Mailpit for the tests
        run: docker compose -f docker-compose.test.yml up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated API client and OpenAPI document must be committed
        run: |
          set -a; . ./.env.example; set +a
          pnpm --filter @auction/api build
          (cd apps/api && node dist/openapi-cli.js openapi.json)
          pnpm --filter @auction/web api:generate
          pnpm exec prettier --write apps/api/openapi.json apps/web/src/shared/api/generated
          git diff --exit-code apps/api/openapi.json apps/web/src/shared/api/generated

  stack:
    name: docker compose up (small seed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example, with a small seed to keep CI fast
        run: |
          cp .env.example .env
          sed -i 's/^SEED_USERS=.*/SEED_USERS=200/; s/^SEED_LOTS=.*/SEED_LOTS=500/; s/^SEED_BIDS=.*/SEED_BIDS=4000/' .env
      - name: db-init must succeed (migrate, app role, seed)
        run: docker compose up --build --exit-code-from db-init --abort-on-container-exit db-init
      - name: db-init must be safe to run again
        run: docker compose up --exit-code-from db-init --abort-on-container-exit db-init
      - name: The application role cannot disable triggers
        run: |
          if docker compose exec -T -e PGPASSWORD=dev-only-app-db-password postgres \
               psql -h localhost -U auction_app -d auction -c "SET session_replication_role = replica"; then
            echo "application role could disable triggers"; exit 1
          fi

  e2e:
    name: e2e (Playwright against the full docker compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Create .env (small seed so start-up is fast)
        run: |
          cp .env.example .env
          sed -i 's/^SEED_USERS=.*/SEED_USERS=300/; s/^SEED_LOTS=.*/SEED_LOTS=1500/; s/^SEED_BIDS=.*/SEED_BIDS=12000/' .env
      - name: Start the whole application
        run: docker compose up --build -d --wait --wait-timeout 600
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auction/web exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm --filter @auction/web e2e
      - name: Show service logs when something failed
        if: failure()
        run: docker compose logs --tail=60 api-a worker web nginx
