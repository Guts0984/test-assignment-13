# Infrastructure for integration tests. Everything lives in RAM and is thrown away on `down`.
#   docker compose -f docker-compose.test.yml up -d --wait
# Ports are shifted away from the defaults so tests never touch the real stack.
name: auction-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: postgres
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - deadlock_timeout=200ms
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auction -d postgres']
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '56379:6379'
    # No persistence: tests flush it on purpose.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.22
    environment:
      MEILI_MASTER_KEY: test-master-key-0123456789
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '57700:7700'
    tmpfs:
      - /meili_data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:7700/health']
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    environment:
      MINIO_ROOT_USER: testminio
      MINIO_ROOT_PASSWORD: testminio-secret
    command: ['minio', 'server', '/data', '--address', ':9000', '--console-address', ':9001']
    ports:
      - '59000:9000'
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9000/minio/health/live || wget -qO- http://localhost:9000/minio/health/live',
        ]
      interval: 1s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '51025:1025'
      - '58025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/livez || exit 1']
      interval: 1s
      timeout: 3s
      retries: 30
