user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/nginx/access.log;

  # Slow-client defences (slowloris): short header/body timeouts, small buffers.
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 30s;
  client_max_body_size 1m;
  client_body_buffer_size 16k;
  large_client_header_buffers 4 8k;

  # One budget per REAL client address ($binary_remote_addr is the TCP peer, never a header).
  limit_req_zone $binary_remote_addr zone=perip:20m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=conns:20m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # ?node=a|b pins a request to one api copy (used by tests to prove cross-copy behaviour).
  map $arg_node $api_backend { a api_a; b api_b; default api; }

  upstream api { server api-a:3000 max_fails=2 fail_timeout=3s; server api-b:3000 max_fails=2 fail_timeout=3s; }
  upstream api_a { server api-a:3000; }
  upstream api_b { server api-b:3000; }
  upstream web { server web:3000; }

  include /etc/nginx/conf.d/*.conf;
}
