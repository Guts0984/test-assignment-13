server {
  listen 8080;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  limit_req zone=perip burst=120 nodelay;
  limit_conn conns 80;

  # The client's address is set by US from the TCP peer; whatever the client sent is discarded,
  # so a spoofed X-Forwarded-For cannot choose which rate-limit bucket it lands in.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_connect_timeout 3s;
  proxy_next_upstream error timeout http_502 http_503;

  # --- websockets (no sticky sessions needed: the Redis adapter connects the copies) ---------
  location /socket.io/ {
    proxy_pass http://$api_backend;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  # --- API (the browser calls /api/..., the prefix is removed) --------------------------------
  location = /api/auth/login { limit_req zone=login burst=10 nodelay; rewrite ^/api/(.*)$ /$1 break; proxy_pass http://$api_backend; }
  location /api/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://$api_backend; }

  location /docs { proxy_pass http://$api_backend; }
  location /provider/ { proxy_pass http://$api_backend; }
  location = /webhooks/payments { client_max_body_size 64k; proxy_pass http://$api_backend; }
  location = /health { proxy_pass http://$api_backend; }

  # --- photos --------------------------------------------------------------------------------
  # Public bucket: anonymous GET only. The private bucket is never reachable for reading.
  location /photos/ {
    limit_except GET HEAD { deny all; }
    rewrite ^/photos/(.*)$ /photos-public/$1 break;
    proxy_pass http://minio:9000;
    proxy_set_header Host minio:9000;
    proxy_hide_header Set-Cookie;
  }
  # Browser uploads (presigned POST) go to the private bucket, nothing else.
  location = /upload/photos-private {
    limit_except POST { deny all; }
    client_max_body_size 11m;
    client_body_timeout 60s;
    rewrite ^/upload/(.*)$ /$1 break;
    proxy_pass http://minio:9000;
    proxy_set_header Host minio:9000;
  }

  # Time-limited signed GET links for private photos (moderators). A valid signature is still required.
  location /signed/ {
    limit_except GET HEAD { deny all; }
    rewrite ^/signed/(.*)$ /$1 break;
    proxy_pass http://minio:9000;
    proxy_set_header Host minio:9000;
  }

  # --- everything else is the web app (Next.js) -----------------------------------------------
  location / {
    proxy_pass http://web;
  }
}
